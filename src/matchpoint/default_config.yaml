# Matchpoint runtime configuration.
# Override with MATCHPOINT_CONFIG=<path>; MATCHPOINT_HOME sets where databases live.

# Simulation clock. The synthetic ERP is generated relative to this date so
# evals are reproducible; a deployment would read the real date instead.
clock: 2026-10-15

# Model tiers. Each agent role maps to a tier; the router walks the fallback
# chain when a model is rate-limited, overloaded, refuses, or its circuit is open.
models:
  fast: claude-haiku-5-5
  balanced: claude-sonnet-5-5
  frontier: claude-opus-5-5

fallback_chain:
  frontier: [balanced]
  balanced: [frontier]
  fast: [balanced]

roles:
  triage:         { tier: fast,     effort: low,    max_tokens: 4000, max_turns: 2 }
  investigator:   { tier: balanced, effort: medium, max_tokens: 8000, max_turns: 10 }
  policy_analyst: { tier: balanced, effort: low,    max_tokens: 4000, max_turns: 5 }
  resolver:       { tier: balanced, effort: high,   max_tokens: 8000, max_turns: 4 }
  reviewer:       { tier: frontier, effort: medium, max_tokens: 4000, max_turns: 3 }
  communicator:   { tier: fast,     effort: low,    max_tokens: 4000, max_turns: 3 }
  judge:          { tier: balanced, effort: low,    max_tokens: 4000, max_turns: 2 }

routing:
  # High-risk cases (fraud signals, injection, large amounts) get the frontier
  # model for the decision; routine cases stay on the cheaper tier.
  high_risk_tier: frontier
  high_risk_amount: 10000
  escalate_roles: [resolver]

budget:            # per run; exceeding any limit fails closed (hold + escalate)
  max_llm_calls: 45
  max_total_tokens: 600000
  max_cost_usd: 2.0
  max_wall_seconds: 600

retry:             # exponential backoff with full jitter; honours retry-after
  max_attempts: 4
  base_delay_s: 0.5
  max_delay_s: 8.0

circuit_breaker:
  failure_threshold: 5
  reset_after_s: 30

policy:            # mirrors the AP policy manual (src/matchpoint/domain/policies)
  price_tolerance_pct: 2.0
  price_tolerance_abs: 250.0
  approval_limit: 25000.0
  duplicate_window_days: 7
  bank_change_cooldown_days: 30

harness:
  max_revisions: 2
  max_graph_steps: 40
  tool_result_max_chars: 6000
  tool_timeout_s: 10
  context_soft_limit_tokens: 60000
  strict_tools: true
  server_side_fallbacks: true
  prompt_caching: true
