name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest

  eval-gate:
    # Offline regression gate: reference policy + chaos, zero safety violations required.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: matchpoint seed
      - run: matchpoint eval --name ci-reference --trials 2 --gate evals/thresholds.yaml --out eval-out
      - run: matchpoint eval --name ci-chaos --trials 2 --chaos 0.25 --gate evals/thresholds.yaml --out eval-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: eval-out/*.md

  live-eval:
    # Opt-in: runs against Claude when the repository has an ANTHROPIC_API_KEY secret.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: matchpoint seed
      - run: matchpoint eval --name live --provider anthropic --yes --gate evals/thresholds.yaml --out eval-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-eval
          path: eval-out/*.md
