[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matchpoint"
version = "0.1.0"
description = "A production-style multi-agent harness for accounts-payable invoice exceptions: state graph, tool calling, RAG, human-in-the-loop, model routing, guardrails, tracing and evals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Safiullah Rahu" }]
keywords = ["agents", "llm", "claude", "harness", "evals", "rag", "accounts-payable"]
dependencies = [
  "anthropic>=0.70",
  "pydantic>=2.7",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
langgraph = ["langgraph>=1.0"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
matchpoint = "matchpoint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
matchpoint = ["default_config.yaml", "domain/policies/*.md", "ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP042"]
